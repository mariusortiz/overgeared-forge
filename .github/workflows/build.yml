name: Build

on:
  push:
    paths-ignore:
      - README.md
      - CREDITS.md
  pull_request:
  workflow_dispatch:

# A newer push replaces a build still running on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          curl -fsSL -o godot.zip "${base}/Godot_v${tag}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${tag}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${tag}_linux.x86_64" /usr/local/bin/godot
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$tpl_dir/"
          rm -rf godot.zip templates.tpz tpl

      - name: Configure Android SDK and debug keystore
        run: |
          minor="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${minor}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import assets
        run: godot --headless --import

      - name: Smoke test (fails on script errors)
        run: |
          # Every screen, then the game playing by itself: forges, and runs in the mine
          # (a strong set, a beginner's set, and no weapon at all).
          for screen in forge combat armory album; do
            godot --headless --fixed-fps 60 --quit-after 120 -- --test --demo --screen=$screen 2>&1 | tee -a run.log
          done
          godot --headless --fixed-fps 60 --quit-after 2400 -- --test --auto --screen=forge 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 9000 -- --test --demo --auto --deep --screen=combat 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 3600 -- --test --basic --auto --screen=combat 2>&1 | tee -a run.log
          godot --headless --fixed-fps 60 --quit-after 3600 -- --test --auto --screen=combat 2>&1 | tee -a run.log
          grep -q "^FORGE " run.log
          # The strong set goes past the second boss; a beginner clears at least one floor.
          grep -qE "^MINE .*cleared=1[0-9] result=beaten" run.log
          test "$(grep -cE "^MINE .*cleared=[1-9]" run.log)" -ge 2
          # "still in use at exit" only reports what --quit-after interrupts.
          if grep -E "SCRIPT ERROR|Parse Error|^ERROR:" run.log | grep -v "still in use at exit"; then exit 1; fi

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          ls -lh build/web/

      - name: Export debug APK
        run: |
          godot --headless --export-debug "Android" build/overgeared-forge-debug.apk
          test -f build/overgeared-forge-debug.apk
          ls -lh build/overgeared-forge-debug.apk

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

      - uses: actions/upload-artifact@v5
        with:
          name: overgeared-forge-debug-apk
          path: build/overgeared-forge-debug.apk

      # The test APK goes to a release whose download link never changes.
      - name: Publish "latest-debug" release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug build/overgeared-forge-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dernière version de test" \
            --notes "APK debug généré automatiquement depuis le commit ${GITHUB_SHA::7}."

  # The web build is served by GitHub Pages.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
